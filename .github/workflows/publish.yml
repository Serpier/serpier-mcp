name: Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Check versions match
        run: |
          server=$(jq -r .version server.json)
          gemini=$(jq -r .version gemini-extension.json)
          if [ "$server" != "$gemini" ]; then
            echo "server.json is $server but gemini-extension.json is $gemini"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$server" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match server.json version $server"
            exit 1
          fi

  # A push to main publishes when server.json carries a version that has no
  # tag yet, then tags it. Pushing a tag by hand still publishes too.
  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is released
        id: release
        run: |
          version=$(jq -r .version server.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.release.outputs.skip != 'true'
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Sign in with the serpier.com DNS key
        if: steps.release.outputs.skip != 'true'
        run: ./mcp-publisher login dns --domain serpier.com --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"

      - name: Publish to the Official MCP Registry
        if: steps.release.outputs.skip != 'true'
        run: ./mcp-publisher publish

      # A tag pushed with GITHUB_TOKEN starts no new workflow run, so this does
      # not publish twice.
      - name: Tag the release
        if: steps.release.outputs.skip != 'true' && github.ref_type == 'branch'
        run: |
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
